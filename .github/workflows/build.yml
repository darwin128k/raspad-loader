name: Build downloads

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      hl_ref:
        description: raspad-hl branch, tag or commit containing the Linux port
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x86 / ${{ matrix.auth }}
    runs-on: windows-2022
    env:
      HL_DIR: ${{ github.workspace }}/build-ci/hl-source
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        auth: [vellum, revemu2013]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Fetch HL launcher sources
        uses: actions/checkout@v4
        with:
          repository: darwin128k/raspad-hl
          ref: ${{ inputs.hl_ref || 'master' }}
          path: build-ci/hl-source
          persist-credentials: false
      - name: Build, test and package both games
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1
          python tools/ci_build.py --platform windows --auth ${{ matrix.auth }}
      - name: Upload archives and checksums
        uses: actions/upload-artifact@v4
        with:
          name: vellum-windows-x86-${{ matrix.auth }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  linux:
    name: Linux x86 / ${{ matrix.auth }}
    runs-on: ubuntu-24.04
    container: debian:12
    env:
      HL_DIR: ${{ github.workspace }}/build-ci/hl-source
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        auth: [vellum, revemu2013]
    steps:
      - name: Install Debian build and runtime dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build python3 gcc-multilib g++-multilib libopus-dev:i386 libasound2-dev:i386 libcurl4:i386
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Fetch HL launcher sources
        uses: actions/checkout@v4
        with:
          repository: darwin128k/raspad-hl
          ref: ${{ inputs.hl_ref || 'master' }}
          path: build-ci/hl-source
          persist-credentials: false
      - name: Build, test and package both games
        run: python3 tools/ci_build.py --platform linux --auth ${{ matrix.auth }}
      - name: Upload archives and checksums
        uses: actions/upload-artifact@v4
        with:
          name: vellum-linux-x86-${{ matrix.auth }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Attach downloads to tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vellum-*
          path: dist
          merge-multiple: true
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
